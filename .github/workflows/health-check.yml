name: Health Check
on:
  push:
    branches: [main]        # check puntual tras cada despliegue a producción
  schedule:
    - cron: '0 0,6,12,18 * * *'  # recurrente: 18:00, 00:00, 06:00 y 12:00 hora de México (UTC-6)
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que el sitio responde
        run: |
          set -u

          SITE_URL="${{ vars.SITE_URL }}"
          CONTROL_URL="https://www.google.com"
          ERR_LOG="$RUNNER_TEMP/curl-site.err"
          CONTROL_ERR_LOG="$RUNNER_TEMP/curl-control.err"
          START=$(date +%s)

          # Segundos desde que arrancó el step, para medir la latencia real del despliegue.
          elapsed() { echo $(( $(date +%s) - START )); }

          # Una lectura: deja el código en STATUS y el stderr de curl en $ERR_LOG.
          # El "|| STATUS=000" va FUERA de la sustitución de comandos: si se pusiera
          # dentro, el "000" de -w se concatenaría con el del fallback y saldría "000000".
          probe() {
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -L --ipv4 --max-time 30 "$1" 2>"$ERR_LOG") || STATUS="000"
          }

          STATUS="000"
          ATTEMPT=0

          if [ "${{ github.event_name }}" = "push" ]; then
            # Post-despliegue: Hostinger puede tardar minutos en publicar, así que no
            # sirve una espera fija. Se hace poll hasta 15 min y se exige una segunda
            # lectura 200 separada por 30s, para no dar por bueno el sitio ANTERIOR
            # (que también responde 200 mientras el despliegue no ha llegado).
            DEADLINE=$(( START + 900 ))
            echo "Modo post-despliegue: poll cada 30s durante un máximo de 15 min, con confirmación."

            while :; do
              ATTEMPT=$(( ATTEMPT + 1 ))
              probe "$SITE_URL"
              echo "Intento $ATTEMPT — Estado HTTP: $STATUS — Transcurrido: $(elapsed)s"

              if [ "$STATUS" = "200" ]; then
                echo "Primer 200 recibido. Confirmando en 30s antes de darlo por bueno."
                sleep 30
                ATTEMPT=$(( ATTEMPT + 1 ))
                probe "$SITE_URL"
                echo "Intento $ATTEMPT (confirmación) — Estado HTTP: $STATUS — Transcurrido: $(elapsed)s"

                if [ "$STATUS" = "200" ]; then
                  echo "Dos lecturas 200 consecutivas. Sitio verificado tras $(elapsed)s."
                  echo "HTTP_STATUS=$STATUS" >> "$GITHUB_ENV"
                  exit 0
                fi

                echo "La confirmación no devolvió 200. Se reanuda el poll."
              fi

              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "Agotados los 15 min sin dos lecturas 200 consecutivas."
                break
              fi

              sleep 30
            done
          else
            # Chequeo programado o manual: el sitio ya debería estar estable.
            echo "Modo chequeo puntual: 3 intentos con 20s de espera."

            for ATTEMPT in 1 2 3; do
              probe "$SITE_URL"
              echo "Intento $ATTEMPT — Estado HTTP: $STATUS — Transcurrido: $(elapsed)s"

              if [ "$STATUS" = "200" ]; then
                echo "HTTP_STATUS=$STATUS" >> "$GITHUB_ENV"
                exit 0
              fi

              if [ "$ATTEMPT" -lt 3 ]; then
                sleep 20
              fi
            done
          fi

          echo "HTTP_STATUS=$STATUS" >> "$GITHUB_ENV"

          # Mensaje de error de curl (lo escribe en stderr gracias a -sS) para el embed.
          # Se aplana a una línea porque GITHUB_ENV no admite saltos sin delimitador.
          CURL_ERROR=$(tr '\n' ' ' < "$ERR_LOG" | tr -s ' ' | cut -c1-200)
          echo "CURL_ERROR=$CURL_ERROR" >> "$GITHUB_ENV"
          echo "Diagnóstico de curl: ${CURL_ERROR:-(sin mensaje)}"

          if [ "$STATUS" = "000" ]; then
            # 000 = no hubo respuesta. Puede ser el sitio, o que el hosting haya
            # descartado la IP de datacenter del runner (falso positivo recurrente).
            # Reintentar no lo distingue: los 3 intentos comparten la misma IP.
            # La petición de control sí: si tampoco sale, el problema es la red del runner.
            echo "Estado final 000 (sin respuesta). Petición de control a $CONTROL_URL para distinguir sitio caído de red del runner bloqueada."
            CONTROL=$(curl -sS -o /dev/null -w "%{http_code}" -L --ipv4 --max-time 30 "$CONTROL_URL" 2>"$CONTROL_ERR_LOG") || CONTROL="000"
            echo "Control — Estado HTTP: $CONTROL"

            if [ "$CONTROL" = "000" ]; then
              echo "El control tampoco responde: el runner no tiene salida de red utilizable."
              echo "Motivo: fallo de red del runner de GitHub, NO del sitio."
              echo "No se emite alerta a Discord y el job termina con éxito."
              exit 0
            fi

            echo "El control responde ($CONTROL): la red del runner funciona, el fallo es atribuible al sitio."
          else
            echo "Estado final $STATUS: código HTTP real distinto de 200, se alerta sin petición de control."
          fi

          echo "El sitio NO devolvió 200. Estado final: $STATUS"
          exit 1

      - name: Avisar en Discord si el sitio está caído
        if: failure()
        run: |
          case "${{ github.event_name }}" in
            push)     TRIGGER="Post-despliegue (push a main)";;
            schedule) TRIGGER="Chequeo programado (cada 6h)";;
            *)        TRIGGER="Manual";;
          esac
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg name    "${{ vars.SITE_NAME }}" \
            --arg url     "${{ vars.SITE_URL }}" \
            --arg status  "${HTTP_STATUS:-000}" \
            --arg trigger "$TRIGGER" \
            --arg diag    "${CURL_ERROR:-Sin mensaje de curl (se recibió respuesta HTTP)}" \
            --arg run     "$RUN_URL" \
            '{username:"Bloodshot Deploy Bot",
              embeds:[{title:"Sitio no responde correctamente",
                       color:15158332,
                       url:$run,
                       fields:[{name:"Sitio",value:$name},
                               {name:"URL",value:$url},
                               {name:"Estado HTTP",value:$status},
                               {name:"Disparador",value:$trigger},
                               {name:"Diagnóstico",value:$diag}]}]}')
          curl -s --ipv4 -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.DISCORD_WEBHOOK }}"
